// ====================================================================
// BIND 9 named.conf for megacorp.internal
// Metasploit 2/e Chapter 3 Intelligence Gathering Simulation Lab
// ====================================================================

options {
    directory "/var/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };

    // Allow queries from anywhere within virtual lab subnet (172.28.0.0/16)
    allow-query { any; };

    // INTENTIONAL VULNERABILITY: Unrestricted Zone Transfer (AXFR)
    // Allows Chapter 3 students to practice DNS enumeration and AXFR attacks
    allow-transfer { any; };

    recursion no;
    dnssec-validation no;
    version "MegaCorp Internal BIND 9.18.1 (Vulnerable AXFR Enabled)";
};

zone "megacorp.internal" IN {
    type master;
    file "/etc/bind/megacorp.internal.zone";
    allow-transfer { any; };
};

zone "28.172.in-addr.arpa" IN {
    type master;
    file "/etc/bind/172.28.rev";
    allow-transfer { any; };
};
